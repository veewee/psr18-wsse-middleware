name: Tests

on: [push, pull_request]
jobs:
    run:
        runs-on: ${{ matrix.operating-system }}
        strategy:
            matrix:
                operating-system: [ubuntu-latest]
                php-versions: [ '8.4', '8.5' ]
                composer-options: [ '--ignore-platform-req=php+' ]
            fail-fast: false
        name: PHP ${{ matrix.php-versions }} @ ${{ matrix.operating-system }}
        steps:
            - name: Checkout
              uses: actions/checkout@master
            - name: Install PHP
              uses: shivammathur/setup-php@master
              with:
                  php-version: ${{ matrix.php-versions }}
                  tools: 'composer:v2'
                  extensions: pcov, mbstring, posix, dom, soap, intl, gmp, bcmath
            - name: Install dependencies
              run: composer update --prefer-dist --no-progress --no-suggest ${{ matrix.composer-options }}
            - name: Run the tests
              # --fail-on-skipped: the crypto tests are gated to PHP >= 8.4.21 and skip silently below it, so a
              # CI run on a too-old patch release would report green having verified no signing or encryption.
              run: ./vendor/bin/phpunit --fail-on-skipped
