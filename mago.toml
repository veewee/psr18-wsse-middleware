# Mago is wired ONLY as the architecture layer guard (`mago guard --perimeter`). The formatter, linter and
# analyzer sections are deliberately left off so it never competes with psalm/cs-fixer — those stay the truth.
php-version = "8.4.0"

[source]
paths = ["src"]
includes = ["vendor"]

[guard]
excludes = ["tests"]

# `layering` is the single source of truth for the internal structure, top of the list = lowest layer. Mago
# enforces it on its own: a layer may depend on any layer BELOW it, never on one above. So the per-namespace
# rules below only have to declare each layer's *external* (vendor) reach plus the few sanctioned exceptions —
# the internal downward graph needs no repetition here.
[guard.perimeter]
layering = [
    "Soap\\Psr18WsseMiddleware\\Algorithm",   # W3C spec identifiers — pure enums/VOs
    "Soap\\Psr18WsseMiddleware\\Xml",          # generic XXE-safe DOM helpers
    "Soap\\Psr18WsseMiddleware\\Clock",        # the "now" seam
    "Soap\\Psr18WsseMiddleware\\KeyStore",     # credential domain kernel
    "Soap\\Psr18WsseMiddleware\\OpenSSL",      # crypto primitives (the openssl/phpseclib boundary)
    "Soap\\Psr18WsseMiddleware\\XmlSecurity",  # XML-DSig + XML-Enc engine — the standalone core, no SOAP
    "Soap\\Psr18WsseMiddleware\\WSSecurity",   # the WS-Security SOAP profile
    "Soap\\Psr18WsseMiddleware\\Wsa",          # WS-Addressing (sibling of WSSecurity, above it here)
]

# Named groups of external (vendor / native) symbols, referenced as @layer:<name> in the permits below.
[guard.perimeter.layers]
base   = ["@native", "Dom\\**", "Psl\\**", "Symfony\\Component\\Uid\\**"]
xml    = ["VeeWee\\Xml\\**", "Soap\\Xml\\**"]
crypto = ["phpseclib3\\**", "ParagonIE\\HiddenString\\**"]
http   = ["Psr\\Http\\**", "Http\\**", "Soap\\Psr18Transport\\**"]

# Layer 0 — pure spec identifiers.
[[guard.perimeter.rules]]
namespace = "Soap\\Psr18WsseMiddleware\\Algorithm"
permit = ["@layer:base"]

# Layer 0 — generic DOM helpers.
[[guard.perimeter.rules]]
namespace = "Soap\\Psr18WsseMiddleware\\Xml"
permit = ["@layer:base", "@layer:xml"]

[[guard.perimeter.rules]]
namespace = "Soap\\Psr18WsseMiddleware\\Clock"
permit = ["@layer:base"]

# Layer 1 — credential kernel. The KeyStore VO ⇄ OpenSSL Parser seam is the one sanctioned upward exception
# (architecture invariant #1): KeyStore reaches OpenSSL only through the Parser and the crypto exception those
# parsers throw. Pem streams key material through phpro/resource-stream.
[[guard.perimeter.rules]]
namespace = "Soap\\Psr18WsseMiddleware\\KeyStore"
permit = [
    "@layer:base",
    "@layer:crypto",
    "Phpro\\ResourceStream\\**",
    "Soap\\Psr18WsseMiddleware\\OpenSSL\\Parser\\**",
    "Soap\\Psr18WsseMiddleware\\OpenSSL\\Exception\\**",
]

# Layer 2 — crypto primitives.
[[guard.perimeter.rules]]
namespace = "Soap\\Psr18WsseMiddleware\\OpenSSL"
permit = ["@layer:base", "@layer:crypto"]

# Layer 3 - the standalone XML-DSig/XML-Enc core. No @layer:crypto: it orchestrates XML and delegates every
# primitive to OpenSSL\, so a phpseclib or HiddenString import appearing here is a misplaced class rather than
# a rule that needs widening. Granting it would let that break the unwrapped-key boundary silently.
#
# phpro/resource-stream is how an external part carries bytes that are not in the document, the same way
# KeyStore\Pem streams key material. It is a stream handle rather than a crypto primitive, so it breaches
# nothing the paragraph above protects.
[[guard.perimeter.rules]]
namespace = "Soap\\Psr18WsseMiddleware\\XmlSecurity"
permit = ["@layer:base", "@layer:xml", "Phpro\\ResourceStream\\**"]

# Layer 4 — the SOAP profile. It sees every layer below it (via `layering`) but NOT the sibling Wsa above it.
[[guard.perimeter.rules]]
namespace = "Soap\\Psr18WsseMiddleware\\WSSecurity"
permit = ["@layer:base", "@layer:xml", "@layer:crypto", "@layer:http"]

# The one place the attachments middleware is reachable from. AttachmentParts adapts that package's storage to
# the XmlSecurity\ExternalParts seam, so the engine below it never names an attachment; this namespace exists
# to hold that adapter alone, which is what makes "only one class knows about that package" a rule the guard
# enforces rather than a comment asking politely. A second class needing it belongs here or nowhere.
# Composer\InstalledVersions is read only to name the installed version in the "too old" message.
[[guard.perimeter.rules]]
namespace = "Soap\\Psr18WsseMiddleware\\WSSecurity\\Attachment"
permit = [
    "@layer:base",
    "Soap\\Psr18AttachmentsMiddleware\\**",
    "Composer\\InstalledVersions",
    "Soap\\Psr18WsseMiddleware\\XmlSecurity\\**",
    "Soap\\Psr18WsseMiddleware\\WSSecurity\\Exception\\**",
]

# WS-Addressing — an independent top layer; needs no WS-Security.
[[guard.perimeter.rules]]
namespace = "Soap\\Psr18WsseMiddleware\\Wsa"
permit = ["@layer:base", "@layer:xml", "@layer:http"]

# The composition root — the WsseMiddleware and WsaMiddleware PSR-18 plugins wire everything below them. This
# bare-root namespace is not a layer; the wildcard is safe because mago matches most-specific-first, so the
# per-layer rules above still bind their own files.
[[guard.perimeter.rules]]
namespace = "Soap\\Psr18WsseMiddleware"
permit = ["@layer:base", "@layer:xml", "@layer:http", "Soap\\Psr18WsseMiddleware\\**"]
